default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DATABASE_USER") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "postgres" } %>
  database: <%= ENV.fetch("DATABASE_NAME") { "tbt_rails_development" } %>

development:
  <<: *default

test:
  <<: *default
  database: tbt_rails_test

production:
  <<: *default
  database: tbt_rails_production
  username: tbt_rails
  password: <%= ENV["TBT_RAILS_DATABASE_PASSWORD"] %>

